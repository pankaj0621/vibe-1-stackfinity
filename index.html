<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Lawazia — One Toto. Three Stops. Zero Confusion.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          ink: { DEFAULT: '#141210', 900: '#0D0B0A', 800: '#1C1815', 700: '#282220', 600: '#3B322C', 500: '#5B4F47' },
          sun: { DEFAULT: '#FFC93C', 400: '#FFD766', 500: '#FFB703', 600: '#E8960C', 100: '#FFF1C9' },
          cream: '#FFF8EC',
          coral: { DEFAULT: '#FF5B4A', 600: '#E8412F', 100: '#FFE1DC' },
          teal: { DEFAULT: '#0FA47F', 600: '#0B7D61', 100: '#D6F3EA' },
          grape: { DEFAULT: '#6D5AE6', 100: '#E7E3FF' }
        },
        fontFamily: {
          display: ['"Space Grotesk"', 'ui-sans-serif', 'system-ui', 'sans-serif'],
          sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif']
        },
        boxShadow: {
          pop: '0 28px 60px -28px rgba(20,18,16,0.45)',
          soft: '0 12px 32px -14px rgba(20,18,16,0.22)',
          glow: '0 18px 44px -18px rgba(255,183,3,0.65)'
        }
      }
    }
  }
</script>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  html { scroll-behavior: smooth; }
  body {
    background:
      radial-gradient(1100px 520px at 88% -8%, rgba(255,201,60,0.22), transparent 62%),
      radial-gradient(820px 480px at -6% 12%, rgba(255,91,74,0.12), transparent 60%),
      #FFF8EC;
    color: #141210;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  ::selection { background: #FFC93C; color: #141210; }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 11px; height: 11px; }
  ::-webkit-scrollbar-track { background: #F3EADA; }
  ::-webkit-scrollbar-thumb { background: linear-gradient(180deg, #FFC93C, #E8960C); border-radius: 999px; border: 3px solid #F3EADA; }

  /* Reveal system */
  .reveal { opacity: 0; transform: translateY(26px); transition: opacity .8s cubic-bezier(.22,1,.36,1), transform .8s cubic-bezier(.22,1,.36,1); will-change: transform, opacity; }
  .reveal.in { opacity: 1; transform: none; }
  .reveal-scale { opacity: 0; transform: translateY(18px) scale(.965); transition: opacity .7s cubic-bezier(.22,1,.36,1), transform .7s cubic-bezier(.22,1,.36,1); }
  .reveal-scale.in { opacity: 1; transform: none; }

  /* Kinetic headline */
  .kin-word { display: inline-block; overflow: hidden; vertical-align: bottom; }
  .kin-word > span {
    display: inline-block;
    transform: translateY(112%) rotate(4deg);
    opacity: 0;
    animation: kinUp .95s cubic-bezier(.19,1,.22,1) forwards;
  }
  @keyframes kinUp { to { transform: translateY(0) rotate(0); opacity: 1; } }

  /* Marquee ticker */
  .ticker-track { display: flex; width: max-content; animation: ticker 34s linear infinite; }
  .ticker:hover .ticker-track { animation-play-state: paused; }
  @keyframes ticker { from { transform: translateX(0); } to { transform: translateX(-50%); } }

  /* Route dash + glow sweep */
  .route-dash { stroke-dasharray: 10 12; animation: dashMove 1.6s linear infinite; }
  @keyframes dashMove { to { stroke-dashoffset: -44; } }

  .sweep { position: relative; overflow: hidden; }
  .sweep::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(105deg, transparent 20%, rgba(255,255,255,.55) 45%, transparent 70%);
    transform: translateX(-120%); transition: transform .85s cubic-bezier(.22,1,.36,1);
    pointer-events: none;
  }
  .sweep:hover::after { transform: translateX(120%); }

  /* Magnetic button */
  .magnet { transition: transform .35s cubic-bezier(.22,1,.36,1), box-shadow .35s ease, background-color .3s ease, color .3s ease; }

  /* Cards */
  .lift { transition: transform .45s cubic-bezier(.22,1,.36,1), box-shadow .45s ease, border-color .35s ease; }
  .lift:hover { transform: translateY(-6px); box-shadow: 0 30px 60px -28px rgba(20,18,16,.42); }

  /* Status pulse */
  .pulse-dot { position: relative; }
  .pulse-dot::before {
    content: ""; position: absolute; inset: -5px; border-radius: 999px;
    background: currentColor; opacity: .35; animation: ping 1.9s cubic-bezier(0,0,.2,1) infinite;
  }
  @keyframes ping { 0% { transform: scale(.65); opacity: .55; } 80%, 100% { transform: scale(2.2); opacity: 0; } }

  /* Banner slide */
  .banner-in { animation: bannerIn .55s cubic-bezier(.22,1,.36,1) both; }
  @keyframes bannerIn { from { opacity: 0; transform: translateY(-14px) scale(.985); } to { opacity: 1; transform: none; } }

  /* List item entrance */
  .item-in { animation: itemIn .55s cubic-bezier(.22,1,.36,1) both; }
  @keyframes itemIn { from { opacity: 0; transform: translateX(-16px); } to { opacity: 1; transform: none; } }

  /* Check draw */
  .draw-check { stroke-dasharray: 32; stroke-dashoffset: 32; animation: draw .55s cubic-bezier(.22,1,.36,1) forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }

  /* Progress bar */
  .bar-fill { transition: width .65s cubic-bezier(.22,1,.36,1); }

  /* Floating orbit */
  .float-slow { animation: floatY 7s ease-in-out infinite; }
  .float-slower { animation: floatY 10s ease-in-out infinite reverse; }
  @keyframes floatY { 0%,100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-16px) rotate(1.2deg); } }

  /* Inputs */
  .field {
    width: 100%; border-radius: 14px; border: 1.5px solid #E7D9C1; background: #fff;
    padding: .82rem 1rem; font-size: .95rem; color: #141210; outline: none;
    transition: border-color .25s ease, box-shadow .25s ease, transform .25s ease;
  }
  .field:hover { border-color: #D6C3A2; }
  .field:focus { border-color: #FFB703; box-shadow: 0 0 0 4px rgba(255,183,3,.24); }
  .field::placeholder { color: #A99B87; }

  .nav-item { position: relative; }
  .nav-item .nav-pill {
    position: absolute; left: 0; top: 8px; bottom: 8px; width: 3px; border-radius: 999px;
    background: #FFB703; transform: scaleY(0); transform-origin: center;
    transition: transform .38s cubic-bezier(.22,1,.36,1);
  }
  .nav-item:hover .nav-pill, .nav-item.active .nav-pill { transform: scaleY(1); }

  .chip { transition: transform .28s cubic-bezier(.22,1,.36,1), background-color .25s ease, color .25s ease, border-color .25s ease; }
  .chip:hover { transform: translateY(-2px); }

  .grain {
    background-image: radial-gradient(rgba(20,18,16,.07) 1px, transparent 1px);
    background-size: 22px 22px;
  }

  .tab-indicator { transition: transform .42s cubic-bezier(.22,1,.36,1), width .42s cubic-bezier(.22,1,.36,1); }

  .no-scrollbar::-webkit-scrollbar { display: none; }
  .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    .reveal, .reveal-scale { opacity: 1 !important; transform: none !important; }
  }
</style>
</head>
<body>
<div id="root"></div>
</body>
</html>
